name: Build Aperture (mruf)
# Builds only the two Windows programs and uploads them as a downloadable artifact.
# Skips the design checks of validate.yml (the custom "mruf" layout has no music box).
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Official signed PawnIO LpcIO module (motherboard fan speeds), latest release.
      - name: Fetch PawnIO LpcIO module
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R namazso/PawnIO.Modules -p "*" -D pm
          Get-ChildItem pm | Format-Table Name, Length
          Get-ChildItem pm -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath "pm/x/$($_.BaseName)" -Force }
          $f = Get-ChildItem pm -Recurse -Filter LpcIO.bin | Select-Object -First 1
          if (-not $f) { throw "LpcIO.bin not found in the PawnIO.Modules release" }
          Copy-Item $f.FullName src/resources/LpcIO.bin
          Get-FileHash src/resources/LpcIO.bin
      - run: cargo build --release --locked --bin aperture-display --bin aperture
      - uses: actions/upload-artifact@v4
        with:
          name: aperture-mruf-windows
          path: |
            target/release/aperture-display.exe
            target/release/aperture.exe
