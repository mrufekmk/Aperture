name: Release Aperture
on:
  push:
    tags: ['v4.*.*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tools/generate-design.py --check
      - run: python tools/check-design.py
      # Official signed PawnIO LpcIO module (motherboard fan speeds), latest release.
      - name: Fetch PawnIO LpcIO module
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R namazso/PawnIO.Modules -p "*" -D pm
          Get-ChildItem pm -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath "pm/x/$($_.BaseName)" -Force }
          $f = Get-ChildItem pm -Recurse -Filter LpcIO.bin | Select-Object -First 1
          if (-not $f) { throw "LpcIO.bin not found in the PawnIO.Modules release" }
          Copy-Item $f.FullName src/resources/LpcIO.bin
      - run: cargo check --locked --bins
      - run: cargo test --release --locked --bins --lib -- --test-threads=1
      - run: cargo build --release --locked --bin aperture-display --bin aperture
      - run: python tools/render-collection.py
      - run: ./tools/package.ps1
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Aperture 4.0
          body_path: docs/RELEASE.md
          files: |
            dist/aperture-windows.zip
            dist/SHA256SUMS.txt
